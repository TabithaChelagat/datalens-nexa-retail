<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataLens</title><style>body{font-family:system-ui;max-width:1000px;margin:0 auto;padding:32px;color:#17202a}button{padding:10px 14px;cursor:pointer}section{border:1px solid #ddd;border-radius:12px;padding:20px;margin:18px 0}pre{white-space:pre-wrap;background:#f5f5f5;padding:14px;border-radius:8px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>DataLens</h1><p>Your data. Your questions. Evidence-backed answers.</p><div class="grid"><section><h2>Try Nexa Retail Demo</h2><p>Explore the prepared, validated retail dataset.</p><button id="demo">Load demo status</button><pre id="demoOut"></pre></section><section><h2>Analyze My Data</h2><p>Upload a CSV or Excel file for an isolated quality profile.</p><input id="file" type="file" accept=".csv,.xlsx,.xls"><button id="profile">Profile file</button><pre id="profileOut"></pre></section></div><script>const out=(id,x)=>document.getElementById(id).textContent=JSON.stringify(x,null,2);document.getElementById('demo').onclick=async()=>out('demoOut',await (await fetch('/api/demo')).json());document.getElementById('profile').onclick=async()=>{const f=document.getElementById('file').files[0];if(!f)return out('profileOut',{error:'Choose a file first.'});const fd=new FormData();fd.append('file',f);const r=await fetch('/api/profile',{method:'POST',body:fd});out('profileOut',await r.json())};</script></body></html>
