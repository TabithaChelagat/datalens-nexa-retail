services:
  db:
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    container_name: datalens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexaretail
      POSTGRES_USER: datalens
      POSTGRES_PASSWORD: datalens_local_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalens -d nexaretail"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/streamlit.Dockerfile
    container_name: datalens-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://datalens:datalens_local_dev_only@db:5432/nexaretail
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8501:8501"
